
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Image Gallery</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 30px;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .gallery img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.04);
            box-shadow: 0 5px 15px #999;
        }

        @media (max-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>

    <h1>My Image Gallery</h1>

    <div class="gallery">

        <img src="https://picsum.photos/id/10/500/400" alt="Nature">
        <img src="https://picsum.photos/id/11/500/400" alt="Forest">
        <img src="https://picsum.photos/id/12/500/400" alt="Mountain">
        <img src="https://picsum.photos/id/13/500/400" alt="Landscape">
        <img src="https://picsum.photos/id/14/500/400" alt="Nature">
        <img src="https://picsum.photos/id/15/500/400" alt="Photography">

    </div>

</body>
</html>
